project:
  name: industrial-aoi-vision-pipeline
  seed: 42

data:
  train_dir: train
  val_dir: val
  classes: ["cat", "dog"]
  image_size: [224, 224]
  num_workers: 2

model:
  name: coatnet_0
  num_classes: 2

training:
  batch_size: 16
  epochs: 20
  learning_rate: 0.00125
  weight_decay: 0.0001
  early_stopping_patience: 3
  device: auto

artifacts:
  checkpoint_dir: artifacts/checkpoints
  report_dir: artifacts/reports
